[project]
name = "url-shortener"
version = "0.1.0"
description = ""
authors = [
    {name = "SenhorDosSonhos1",email = "marcelosamu2002@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13, <4.0"
dependencies = [
    "fastapi[standard] (>=0.143.0,<0.144.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.0,<0.18.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]

[tool.ruff]
line-length = 79

[tool.ruff.format]
preview = true
quote-style="single"

[tool.taskipy.tasks]
lint = "ruff check . --diff"
format = "ruff check . --fix && ruff format ."
pre_test = "ruff check . --fix && ruff format ."
test = "pytest -vv --cov=project_folder --cov-report term-missing -p no:warnings ."
post_test = "coverage html"
dev = "uvicorn app.main:app --reload"